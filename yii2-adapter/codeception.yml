actor: Tester
paths:
  tests: legacy-tests
  log: legacy-tests/_output
  data: legacy-tests/_data
  support: legacy-tests/_support
  output: legacy-tests/_output
  envs: legacy-tests/_envs
bootstrap: _bootstrap.php
settings:
  colors: true
  memory_limit: 4096M
coverage:
  enabled: true
  include:
    - src/*
  exclude:
    - legacy/config/*
    - legacy/icons/*
    - legacy/test/internal/*
    - legacy/test/templates/*
    - legacy/migrations/*
    - legacy/templates/*
    - legacy/translations/*
    - legacy/views/*
    - legacy/web/assets/*
    - bootstrap/*
    - lib/*
    - legacy-tests/*
    - vendor/*
params:
  - env
  - legacy-tests/.env
modules:
  config:
    \craft\test\Craft:
      configFile: 'legacy-tests/_craft/config/test.php'
      entryUrl: 'https://localhost/index.php'
      projectConfig: {}
      migrations: []
      plugins: []
      cleanup: true # Should tests and fixtures be cleaned
      transaction: true # Wrap in transaction
      dbSetup: {clean: true, setupCraft: true} # What DB setup work do we need to do.
      fullMock: false
  DataFactory:
    factories: legacy-tests/_craft/config/factories
    depends: \craft\test\Craft
groups:
  base: [legacy-tests/unit/base]
  behaviors: [legacy-tests/unit/behaviors]
  db: [legacy-tests/unit/db]
  elements: [legacy-tests/unit/elements]
  helpers: [legacy-tests/unit/helpers]
  mail: [legacy-tests/unit/mail]
  search: [legacy-tests/unit/search]
  services: [legacy-tests/unit/services]
  test: [legacy-tests/unit/test]
  validators: [legacy-tests/unit/validators]
  web: [legacy-tests/unit/web]
  app: [legacy-tests/unit/AppTest.php]
  gql:
    - 'legacy-tests/unit/gql'
    - 'legacy-tests/unit/services/GqlTest.php'
    - 'legacy-tests/unit/helpers/GqlHelperTest.php'
    - 'legacy-tests/gql'
