<?xml version="1.0" encoding="UTF-8"?>
<svg width="80px" height="60px" viewBox="0 0 80 60" version="1.1" xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink">
    <defs>
        <path d="M0,0 L80,0 L80,60 L0,60 L0,0 Z" id="path-1"></path>
        <path d="M0,0 L56,0 L56,56 L0,56 L0,0 Z" id="path-2"></path>
        <path d="M0,0 L8,0 L8,8 L0,8 L0,0 Z" id="path-3"></path>
        <path d="M0,0 L8,0 L8,8 L0,8 L0,0 Z" id="path-4"></path>
        <path d="M0,0 L8,0 L8,8 L0,8 L0,0 Z" id="path-5"></path>
        <path d="M0,0 L8,0 L8,8 L0,8 L0,0 Z" id="path-6"></path>
    </defs>
    <g id="crop" stroke="none" fill="none" transform="translate(0, 0)" xlink:href="#path-1">
        <g id="image" stroke-width="1" fill-rule="evenodd" transform="translate(0.5, 4)">
            <!-- The photo, as in the thumb style illustrations -->
            <svg x="-0.5" y="0" width="80" height="52" viewBox="0 0 80 60" preserveAspectRatio="xMidYMid slice">
                <rect x="0" y="0" width="80" height="60" style="fill: var(--c-illustration-field)"></rect>
                <path d="M0,46 L22,22 L36,37 L48,26 L80,52 L80,60 L0,60 Z" style="fill: var(--c-illustration-figure)"></path>
                <circle cx="60" cy="16" r="5" style="fill: var(--c-illustration-figure)"></circle>
            </svg>
            <!-- The photo's edge, so its position inside the frame shows -->
            <rect fill="none" x="0" y="0.5" width="79" height="51" style="stroke: var(--c-illustration-line)"></rect>
        </g>
        <g transform="translate(12, 2)" xlink:href="#path-2">
            <path d="M2,2 L54,2 L54,54 L2,54 Z" id="crop-border" stroke-width="1" stroke-dasharray="1" style="stroke: var(--c-illustration-mark)"></path>
            <g id="corner" xlink:href="#path-3" stroke-width="2" paint-order="stroke" stroke-linejoin="round" fill-rule="evenodd" style="fill: var(--c-illustration-mark); stroke: var(--c-illustration-paper)">
                <path d="M4,8 L0,8 L0,0 L8,0 L8,4 L4,4 L4,8 Z" id="Combined-Shape"></path>
            </g>
            <g id="corner-copy" transform="translate(4, 52) rotate(-90) translate(-4, -52)translate(0, 48)" xlink:href="#path-4" stroke-width="2" paint-order="stroke" stroke-linejoin="round" fill-rule="evenodd" style="fill: var(--c-illustration-mark); stroke: var(--c-illustration-paper)">
                <path d="M4,8 L0,8 L0,0 L8,0 L8,4 L4,4 L4,8 Z" id="Combined-Shape"></path>
            </g>
            <g id="corner-copy-3" transform="translate(52, 4) scale(-1, 1) translate(-52, -4)translate(48, 0)" xlink:href="#path-5" stroke-width="2" paint-order="stroke" stroke-linejoin="round" fill-rule="evenodd" style="fill: var(--c-illustration-mark); stroke: var(--c-illustration-paper)">
                <path d="M4,8 L0,8 L0,0 L8,0 L8,4 L4,4 L4,8 Z" id="Combined-Shape"></path>
            </g>
            <g id="corner-copy-2" transform="translate(52, 52) scale(-1, 1) rotate(-90) translate(-52, -52)translate(48, 48)" xlink:href="#path-6" stroke-width="2" paint-order="stroke" stroke-linejoin="round" fill-rule="evenodd" style="fill: var(--c-illustration-mark); stroke: var(--c-illustration-paper)">
                <path d="M4,8 L0,8 L0,0 L8,0 L8,4 L4,4 L4,8 Z" id="Combined-Shape"></path>
            </g>
        </g>
    </g>
</svg>