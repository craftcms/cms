        <path d="M0,0 L8,0 L8,8 L0,8 L0,0 Z" id="path-6"></path>
    </defs>
    <g id="crop" stroke="none" fill="none" transform="translate(0, 0)" xlink:href="#path-1">
        <g id="image" stroke-width="1" fill-rule="evenodd" transform="translate(0.5, 4)">
            <!-- The photo, as in the thumb style illustrations -->
            <svg x="-0.5" y="0" width="80" height="52" viewBox="0 0 80 60" preserveAspectRatio="xMidYMid slice">
