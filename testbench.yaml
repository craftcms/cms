providers:
  - Inertia\ServiceProvider
  - Laravel\Tinker\TinkerServiceProvider
  - CraftCms\Aliases\AliasesServiceProvider
  - CraftCms\DependencyAwareCache\CacheServiceProvider
  - CraftCms\Cms\Providers\CraftServiceProvider
  - CraftCms\Yii2Adapter\Yii2ServiceProvider
  - Laravel\Wayfinder\WayfinderServiceProvider

seeders:
  - Workbench\Database\Seeders\DatabaseSeeder

workbench:
  welcome: true
  start: /admin
  install: false # We run the Craft install in DatabaseSeeder
  user: 1
  guard: craft
  sync:
    - from: resources
      to: public/vendor/craft
    - from: storage
      to: workbench/storage
      reverse: true
  build:
    - tinker:
        --execute: >
          try { DB::connection()->getPdo(); } catch (PDOException) {
            $name = DB::getDatabaseName();
            $driver = DB::getDriverName();
            config()->set('database.connections.'.config('database.default').'.database', match($driver) { 'mysql', 'mariadb' => null, 'pgsql' => 'template1' });
            DB::purge();
            DB::unprepared(match($driver) { 'mysql', 'mariadb' => "CREATE DATABASE IF NOT EXISTS `$name`", 'pgsql' => "CREATE DATABASE \"$name\"" });
            DB::purge();
          }
    - migrate-fresh
  discovers:
    web: true
    commands: true
    config: true
    factories: true
    seeders: true
