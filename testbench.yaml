providers:
  - Inertia\ServiceProvider
  - Laravel\Tinker\TinkerServiceProvider
  - Laravel\Socialite\SocialiteServiceProvider
  - Laravel\Ai\AiServiceProvider
  - CraftCms\Aliases\AliasesServiceProvider
  - CraftCms\DependencyAwareCache\CacheServiceProvider
  - CraftCms\Cms\Providers\CraftServiceProvider
  - Laravel\Wayfinder\WayfinderServiceProvider
  - Spatie\LaravelTypeScriptTransformer\TypeScriptTransformerServiceProvider
  - Workbench\App\Providers\TypeScriptTransformerServiceProvider

env:
  # queued jobs, imports included, run in the background as they do on a real site
  - QUEUE_CONNECTION=database
  # kept between requests, as locks and the like are on a real site
  - CACHE_STORE=database

seeders:
  - Workbench\Database\Seeders\DatabaseSeeder

workbench:
  welcome: true
  start: /admin
  install: false # We run the Craft install in DatabaseSeeder
  user: 1
  sync:
    - from: cms-assets/resources
      to: public/vendor/craft
    - from: storage
      to: workbench/storage
      reverse: true
  build:
    - migrate-fresh
  discovers:
    web: true
    commands: true
    config: true
    factories: true
    seeders: true
