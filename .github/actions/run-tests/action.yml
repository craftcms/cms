name: 'Run Tests'
description: 'Setup PHP, install dependencies, and run a test command'

inputs:
  test-command:
    description: 'The test command to run'
    required: true
  tia:
    description: 'Use TIA on pull requests and record fresh baselines on 6.x pushes'
    required: false
    default: 'false'
  tia-environment:
    description: 'Environment identifier for isolating TIA baselines (e.g. mysql)'
    required: false
    default: default
  php-version:
    description: 'PHP version to install'
    required: false
    default: '8.5'
  coverage:
    description: 'Coverage driver to use'
    required: false
    default: 'none'
  github-token:
    description: 'GitHub token for Composer'
    required: false
    default: ''
  packagist-username:
    description: 'Packagist username'
    required: false
    default: ''
  packagist-token:
    description: 'Packagist token'
    required: false
    default: ''
  working-directory:
    description: 'Additional directory to run composer install in (e.g. yii2-adapter)'
    required: false
    default: ''
  disable-browser-plugin:
    description: 'Stop Pest from loading pestphp/pest-plugin-browser'
    required: false
    default: 'false'

runs:
  using: 'composite'
  steps:
    - name: Setup PHP
      uses: shivammathur/setup-php@v2
      with:
        php-version: ${{ inputs.php-version }}
        extensions: dom, curl, libxml, mbstring, zip, pcntl, pdo, sqlite, pdo_sqlite, bcmath, soap, intl, gd, exif, iconv, imagick, fileinfo, ffi, sodium, sockets, opcache
        tools: composer:v2
        # Coverage drivers override PHP's executor and cannot run with JIT.
        ini-values: display_errors=On, memory_limit=4G, opcache.enable_cli=1, opcache.memory_consumption=256, opcache.jit=${{ inputs.coverage == 'none' && 'tracing' || 'disable' }}
        coverage: ${{ inputs.coverage }}
        # Pass an empty token so setup-php doesn't write GITHUB_TOKEN into
        # Composer's auth config. Composer 2.9.7's regex rejects the new
        # GITHUB_TOKEN format (composer/composer#12849).
        github-token: ''
      env:
        # COMPOSER_TOKEN: ${{ inputs.github-token }}
        COMPOSER_AUTH_JSON: |
          {
            "http-basic": {
              "repo.packagist.com": {
                "username": "${{ inputs.packagist-username }}",
                "password": "${{ inputs.packagist-token }}"
              }
            }
          }

    - name: Set version
      shell: bash
      run: composer config version "6.x-dev"

    - name: Install dependencies
      uses: ramsey/composer-install@v3

    - name: Set additional directory version
      if: inputs.working-directory != ''
      shell: bash
      run: composer config version "6.x-dev"
      working-directory: ${{ inputs.working-directory }}

    - name: Install additional directory dependencies
      if: inputs.working-directory != ''
      uses: ramsey/composer-install@v3
      with:
        working-directory: ${{ inputs.working-directory }}

    - name: Restore TIA baseline
      if: inputs.tia == 'true' && github.event_name == 'pull_request'
      uses: actions/cache/restore@v4
      with:
        path: .phpunit.cache/tia
        key: pest-tia-v2-${{ github.base_ref }}-${{ runner.os }}-${{ inputs.php-version }}-${{ inputs.tia-environment }}-${{ github.event.pull_request.base.sha }}
        restore-keys: |
          pest-tia-v2-${{ github.base_ref }}-${{ runner.os }}-${{ inputs.php-version }}-${{ inputs.tia-environment }}-

    # Pest loads every plugin listed in vendor/pest-plugins.json. With the
    # browser plugin loaded, php.exe on Windows fail-fasts (0xC0000409) as it
    # exits, after every test has passed, and Git Bash reports that as exit
    # code 127. Suites without browser tests don't need the plugin.
    - name: Disable the Pest browser plugin
      if: inputs.disable-browser-plugin == 'true'
      shell: bash
      run: php -r '$file = "vendor/pest-plugins.json"; file_put_contents($file, json_encode(array_values(array_diff(json_decode(file_get_contents($file), true), ["Pest\\Browser\\Plugin"]))));'

    - name: Run tests
      shell: bash
      env:
        CRAFT_TIA_DIRECTORY: ${{ inputs.tia == 'true' && '.phpunit.cache/tia' || '' }}
      run: ${{ inputs.test-command }} ${{ inputs.tia == 'true' && github.event_name == 'push' && github.ref == 'refs/heads/6.x' && '--tia --fresh' || '' }}

    - name: Save TIA baseline
      if: inputs.tia == 'true' && github.event_name == 'push' && github.ref == 'refs/heads/6.x'
      uses: actions/cache/save@v4
      with:
        path: .phpunit.cache/tia
        key: pest-tia-v2-${{ github.ref_name }}-${{ runner.os }}-${{ inputs.php-version }}-${{ inputs.tia-environment }}-${{ github.sha }}
