name: facades

on:
  push:
    branches:
      - main
      - '*.x'

  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: facades-${{ github.ref }}
  cancel-in-progress: true

jobs:
  update:
    runs-on: ubuntu-24.04
    permissions:
      contents: write # Required to push generated facade docblock commits.

    strategy:
      fail-fast: true

    name: Facade DocBlocks

    steps:
      - name: Checkout code
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          persist-credentials: false

      - name: Setup PHP
        uses: shivammathur/setup-php@7c071dfe9dc99bdf297fa79cb49ea005b9fcadbc # v2
        with:
          php-version: 8.5
          extensions: :php-psr
          tools: composer:v2
          coverage: none
        env:
          COMPOSER_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          COMPOSER_AUTH_JSON: |
            {
              "http-basic": {
                "repo.packagist.com": {
                  "username": "${{ secrets.packagist_username }}",
                  "password": "${{ secrets.packagist_token }}"
                }
              }
            }

      - name: Install dependencies
        run: |
          composer config repositories.facade-documenter vcs git@github.com:laravel/facade-documenter.git
          composer require --dev laravel/facade-documenter:dev-main --prefer-stable --prefer-dist --no-interaction --no-progress -W

      - name: Update facade docblocks
        run: |
          mapfile -t facades < <(find src/Support/Facades -name '*.php' -type f | sort)
          facade_classes=()

          for facade in "${facades[@]}"; do
            facade_classes+=("CraftCms\\Cms\\Support\\Facades\\$(basename "$facade" .php)")
          done

          php -f vendor/bin/facade.php -- "${facade_classes[@]}"

      - name: Commit facade docblocks
        env:
          BRANCH: ${{ github.ref_name }}
          GH_TOKEN: ${{ github.token }}
          REF_TYPE: ${{ github.ref_type }}
        run: |
          if [[ "$REF_TYPE" != "branch" ]]; then
            echo "Skipping commit on non-branch ref: $REF_TYPE"
            exit 0
          fi

          if [[ -z "$(git status --porcelain -- src/)" ]]; then
            echo "No facade docblock changes to commit."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/
          git commit -m "Update facade docblocks"
          gh auth setup-git
          git push origin "HEAD:${BRANCH}"
