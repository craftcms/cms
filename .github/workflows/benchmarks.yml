name: 'ci / Benchmarks'
on:
  pull_request:
    paths:
      - 'src/**'
      - 'config/**'
      - 'database/**'
      - 'routes/**'
      - 'composer.lock'
      - 'tests/Benchmark/**'
      - 'tally.php'
      - 'scripts/benchmark*'
      - 'workbench/**'

concurrency:
  group: benchmarks-${{ github.ref }}
  cancel-in-progress: true

# Pull requests from forks only get a read-only token, so this workflow uploads the report and
# benchmarks-comment.yml posts it on the pull request.
permissions:
  contents: read

jobs:
  benchmarks:
    name: 'Benchmarks'
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.5'
          extensions: dom, curl, libxml, mbstring, zip, pcntl, pdo, sqlite, pdo_sqlite, bcmath, intl, gd, exif, iconv, fileinfo, opcache
          tools: composer:v2
          coverage: none
        env:
          COMPOSER_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          COMPOSER_AUTH_JSON: |
            {
              "http-basic": {
                "repo.packagist.com": {
                  "username": "${{ secrets.packagist_username }}",
                  "password": "${{ secrets.packagist_token }}"
                }
              }
            }

      # The icons and front-end builds are generated and gitignored, so they come from the published cms-assets
      # package. It's untracked, so it stays in place while the base and the pull request are checked out.
      - name: Install CMS assets
        run: |
          git clone --depth 1 --branch 6.x https://github.com/craftcms/cms-assets.git "$RUNNER_TEMP/cms-assets"
          cp -rn "$RUNNER_TEMP/cms-assets/resources/." cms-assets/resources/

      # Tally loads its tally_hooks extension only in the counted run, and loading it changes PHP's opcache system ID.
      # The counted run would then miss the opcache file cache that the native run filled and compile every script.
      # Which case compiled a script first would decide which case paid for it. Loading the extension into tally run
      # itself puts it in every worker's php.ini, so both runs share one cache. The path is the same for both checkouts.
      - name: Load Tally's extension in every benchmark process
        run: |
          mkdir -p "$RUNNER_TEMP/tally-ini"
          build=$(php -r 'echo PHP_MAJOR_VERSION, ".", PHP_MINOR_VERSION;')
          echo "extension=$GITHUB_WORKSPACE/vendor/phpstan/tally/codspeed/linux-$(uname -m)/tally_hooks-$build.so" \
            > "$RUNNER_TEMP/tally-ini/tally-hooks.ini"

      # Both are measured on the same runner. Tally counts instructions, cycles and memory under a CPU simulation rather
      # than timing them, so the numbers hardly move between runs. The base runs its own benchmarks and seed, so a
      # change to either shows from the next pull request on.
      - name: Benchmark the base branch
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          git checkout --force "$BASE_SHA"
          if [ ! -f tally.php ]; then
            echo "The base branch has no Tally benchmarks."
            exit 0
          fi
          composer config version "6.x-dev"
          composer install --no-interaction --no-progress
          scripts/benchmark-setup.sh
          GITHUB_ACTIONS=false PHP_INI_SCAN_DIR=":$RUNNER_TEMP/tally-ini" vendor/bin/tally run --output="$RUNNER_TEMP/base" \
            || echo "::warning::Some of the base branch's benchmarks failed, so they have nothing to compare with."

      # `tally accept` writes the base's numbers into the pull request's benchmarks as their expected numbers, so
      # `tally run` compares the two. Benchmarks that only one side has are left out of the comparison or reported as new.
      - name: Benchmark the pull request
        id: benchmarks
        env:
          HEAD_SHA: ${{ github.sha }}
        run: |
          git checkout --force "$HEAD_SHA"
          composer config version "6.x-dev"
          composer install --no-interaction --no-progress
          scripts/benchmark-setup.sh
          if [ -d "$RUNNER_TEMP/base" ]; then
            vendor/bin/tally accept "$RUNNER_TEMP/base"
          fi

          # The job summary goes to the report rather than to this job. Tally's annotations are left out because they
          # point to lines of the benchmarks with the base's numbers written into them.
          set -o pipefail
          status=0
          GITHUB_STEP_SUMMARY="$RUNNER_TEMP/tally.md" PHP_INI_SCAN_DIR=":$RUNNER_TEMP/tally-ini" vendor/bin/tally run | sed '/^::/d' || status=$?
          echo "status=$status" >> "$GITHUB_OUTPUT"

      # Tally's report suggests commands that reproduce or accept numbers committed to the benchmarks, which they
      # aren't here, so those sections are left out. The benchmarks' namespace is too, to keep the tables narrow.
      - name: Write the report
        env:
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          mkdir -p "$RUNNER_TEMP/benchmarks"
          {
            printf '<!-- craft-benchmarks -->\n### Benchmarks\n\n'
            awk '/^### (Reproduce locally|Accept the new numbers|Expected numbers of the new benchmarks)$/ { skip = 1; next }
              /^(### |<details>)/ { skip = 0 }
              !skip' "$RUNNER_TEMP/tally.md" | sed -e 's/^## /#### /' -e 's/CraftCms\\Cms\\Tests\\Benchmark\\//g'
            printf '\n<sub>Expected is the base branch and measured is this pull request, both counted in this job by [Tally](https://github.com/phpstan/tally) under a CPU simulation.</sub>\n'
          } > "$RUNNER_TEMP/benchmarks/report.md"
          echo "$PR_NUMBER" > "$RUNNER_TEMP/benchmarks/pr-number"
          cat "$RUNNER_TEMP/benchmarks/report.md" >> "$GITHUB_STEP_SUMMARY"

      - name: Upload the report
        uses: actions/upload-artifact@v4
        with:
          name: benchmarks
          path: ${{ runner.temp }}/benchmarks
          retention-days: 7

      - name: Fail on slower or failed benchmarks
        if: steps.benchmarks.outputs.status != '0'
        run: |
          echo "::error::Some benchmarks are slower than on the base branch or failed. See the job summary."
          exit 1
