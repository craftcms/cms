name: ci
on:
  workflow_dispatch:
  push:
    branches:
      - 5.x
      - '5.13'
      - '*-internal'
  pull_request:
permissions:
  contents: read
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  composer-windows:
    name: Composer on Windows
    runs-on: windows-2022
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: bcmath,curl,dom,imagick,intl,mbstring,pdo_mysql,zip
          coverage: none
          tools: composer:v2
      - uses: shogo82148/actions-setup-mysql@00c22a3f5d8beda901ed37debc6ea0f120642ebd # v1
        with:
          mysql-version: '8.0'
      - name: Prepare database
        run: |
          mysql --host=127.0.0.1 --user=root --execute="CREATE DATABASE craft_test"
          Copy-Item tests/.env.example.mysql tests/.env
      - name: Install dependencies
        run: |
          composer config version 5.x-dev
          composer install --no-interaction --no-progress
      - name: Test Composer launchers
        run: php vendor/bin/codecept run unit services/ComposerTest.php --no-colors
  ci:
    name: ci
    uses: craftcms/.github/.github/workflows/ci.yml@v3
    with:
      php_version: '8.2'
      craft_version: '5'
      node_version: '20'
      jobs: '["ecs", "prettier", "phpstan", "tests", "rector"]'
      notify_slack: true
      slack_subteam: <!subteam^SGFL9NKNZ>
    secrets:
      token: ${{ secrets.GITHUB_TOKEN }}
      slack_webhook_url: ${{ secrets.SLACK_CRAFT_WEBHOOK_URL }}
