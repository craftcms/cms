name: Auto-resolve merge conflicts
on:
  push:
    branches:
      - 5.x
      - 6.x
permissions:
  contents: read
jobs:
  find-conflicted-prs:
    name: find conflicted PRs
    runs-on: ubuntu-latest
    steps:
      - name: Dispatch resolution for same-repo PRs with conflicts
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          BASE: ${{ github.ref_name }}
        run: |
          set -e
          # isCrossRepository == false means the PR's head branch lives in this repo,
          # not a fork — forks are ignored entirely, not just skipped later.
          numbers=$(gh pr list --repo "$REPO" --base "$BASE" --state open \
            --json number,isCrossRepository -q '.[] | select(.isCrossRepository == false) | .number')

          for n in $numbers; do
            # GitHub computes mergeable state asynchronously; poll briefly until it's known
            state=UNKNOWN
            for i in 1 2 3 4 5; do
              state=$(gh pr view "$n" --repo "$REPO" --json mergeable -q '.mergeable')
              [ "$state" != "UNKNOWN" ] && break
              sleep 5
            done
            echo "PR #$n mergeable state: $state"

            if [ "$state" = "CONFLICTING" ]; then
              # anthropics/claude-code-action doesn't support the `push` event, so hand off
              # to resolve-conflict.yml (repository_dispatch) to do the actual resolution.
              gh api "repos/$REPO/dispatches" \
                -f event_type=resolve-merge-conflict \
                -F "client_payload[pr]=$n" \
                -f "client_payload[base]=$BASE"
              echo "Dispatched resolution for PR #$n"
            fi
          done
