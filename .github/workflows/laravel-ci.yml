name: 'ci / Laravel'
on:
  workflow_dispatch:
  push:
    branches:
      - main
      - 6.x
  pull_request:

permissions:
  contents: read

concurrency:
  group: laravel-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  pint:
    name: 'Code Quality / Pint'
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout code
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          ref: ${{ github.head_ref }}
          persist-credentials: false

      - name: Setup PHP
        uses: shivammathur/setup-php@7c071dfe9dc99bdf297fa79cb49ea005b9fcadbc # v2
        with:
          php-version: '8.5'
          extensions: json, dom, curl, libxml, mbstring
          tools: composer:v2, laravel/pint
          coverage: none

      - name: Run Pint
        run: pint --parallel --test --verbose

  rector:
    name: 'Code Quality / Rector'
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout code
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          ref: ${{ github.head_ref }}
          persist-credentials: false

      - name: Setup PHP
        uses: shivammathur/setup-php@7c071dfe9dc99bdf297fa79cb49ea005b9fcadbc # v2
        with:
          php-version: '8.5'
          extensions: dom, curl, libxml, mbstring, zip, pcntl, pdo, sqlite, pdo_sqlite, bcmath, soap, intl, gd, exif, iconv, imagick, fileinfo
          coverage: none
        env:
          COMPOSER_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          COMPOSER_AUTH_JSON: |
            {
              "http-basic": {
                "repo.packagist.com": {
                  "username": "${{ secrets.packagist_username }}",
                  "password": "${{ secrets.packagist_token }}"
                }
              }
            }

      - name: Set version
        run: composer config version "6.x-dev"

      - name: Install dependencies
        uses: ramsey/composer-install@a8d0d959dab41457692a5e2041bd9b757a119e3f # v3

      - name: Rector Cache
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: /tmp/rector
          key: ${{ runner.os }}-rector-${{ github.run_id }}
          restore-keys: ${{ runner.os }}-rector-

      - run: mkdir -p /tmp/rector

      - name: Run Rector
        run: vendor/bin/rector process --dry-run --ansi

  phpstan:
    name: 'Code Quality / Phpstan'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5
        with:
          persist-credentials: false

      - name: Setup PHP
        uses: shivammathur/setup-php@7c071dfe9dc99bdf297fa79cb49ea005b9fcadbc # v2
        with:
          php-version: '8.5'
          extensions: dom, curl, libxml, mbstring, zip, pcntl, pdo, sqlite, pdo_sqlite, bcmath, soap, intl, gd, exif, iconv, imagick, fileinfo
          tools: composer:v2
          coverage: none

      - name: Set version
        run: composer config version "6.x-dev"

      - name: Install composer dependencies
        uses: ramsey/composer-install@a8d0d959dab41457692a5e2041bd9b757a119e3f # v3
      
      - name: PHPStan Cache
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: /tmp/phpstan
          key: ${{ runner.os }}-phpstan-${{ github.run_id }}
          restore-keys: ${{ runner.os }}-phpstan-

      - name: Run PHPStan
        run: ./vendor/bin/phpstan --error-format=github

  unit-tests:
    needs: [pint, phpstan, rector]
    name: 'Tests / Unit on ${{ matrix.os }}'
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    strategy:
      fail-fast: true
      matrix:
        os: [ubuntu-latest, windows-latest]

    steps:
      - name: Checkout code
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          persist-credentials: false

      - name: Run tests
        uses: ./.github/actions/run-tests
        with:
          test-command: ./vendor/bin/pest --ci --compact --testsuite=Unit
          github-token: ${{ secrets.GITHUB_TOKEN }}
          packagist-username: ${{ secrets.packagist_username }}
          packagist-token: ${{ secrets.packagist_token }}

  arch-tests:
    needs: [pint, phpstan, rector]
    name: 'Tests / Arch'
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout code
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          persist-credentials: false

      - name: Run tests
        uses: ./.github/actions/run-tests
        with:
          test-command: ./vendor/bin/pest --ci --testsuite=Arch
          github-token: ${{ secrets.GITHUB_TOKEN }}
          packagist-username: ${{ secrets.packagist_username }}
          packagist-token: ${{ secrets.packagist_token }}

  feature-tests:
    needs: [pint, phpstan, rector]
    name: 'Tests / Feature on ${{ matrix.os }} with ${{ matrix.db }}'
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: true
      matrix:
        os: [ubuntu-latest, windows-latest]
        php: [8.5]
        db: [mysql, pgsql, sqlite]
        exclude:
          # Preinstalled MySQL/PostgreSQL services are only available on Ubuntu runners.
          - os: windows-latest
            db: mysql
          - os: windows-latest
            db: pgsql

    steps:
      - name: Checkout code
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          persist-credentials: false

      - name: Start MySQL
        if: matrix.os == 'ubuntu-latest' && matrix.db == 'mysql'
        run: |
          sudo systemctl start mysql.service
          mysql --host=127.0.0.1 --user=root --password=root --execute="CREATE DATABASE IF NOT EXISTS craft_test"

      - name: Start PostgreSQL
        if: matrix.os == 'ubuntu-latest' && matrix.db == 'pgsql'
        run: |
          sudo systemctl start postgresql.service
          sudo -u postgres createuser --login --superuser root
          sudo -u postgres psql -v ON_ERROR_STOP=1 --command="ALTER ROLE root WITH PASSWORD 'root'"
          sudo -u postgres createdb --owner=root craft_test

      - name: Copy tests .env
        shell: bash
        env:
          DB: ${{ matrix.db }}
        run: |
          cp "./tests/.env.example.${DB}" ./tests/.env
          sed -i 's/DB_PASSWORD=/DB_PASSWORD=root/' tests/.env
          touch database/craft_tests.sqlite

      - name: Run tests
        uses: ./.github/actions/run-tests
        with:
          test-command: ./vendor/bin/pest --ci --compact --testsuite=Feature
          github-token: ${{ secrets.GITHUB_TOKEN }}
          packagist-username: ${{ secrets.packagist_username }}
          packagist-token: ${{ secrets.packagist_token }}

  yii2-adapter-tests:
    needs: [pint, phpstan, rector]
    name: 'Tests / Yii2 Adapter'
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout code
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          persist-credentials: false

      - name: Run tests
        uses: ./.github/actions/run-tests
        with:
          test-command: vendor/bin/pest --ci --compact --configuration ./yii2-adapter/phpunit.xml.dist --test-directory ./yii2-adapter/tests-laravel
          github-token: ${{ secrets.GITHUB_TOKEN }}
          packagist-username: ${{ secrets.packagist_username }}
          packagist-token: ${{ secrets.packagist_token }}
          working-directory: yii2-adapter
