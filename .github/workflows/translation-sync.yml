name: Translation sync
on:
  push:
    branches: [translations]
  schedule:
    - cron: '0 9 * * *'
  workflow_dispatch:
concurrency:
  group: translation-sync
permissions:
  contents: write
  pull-requests: write
jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: craftcms/translation-sync@v1
